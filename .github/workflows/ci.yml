name: Learnfy validation
on:
  push:
    branches: [main, arena/01a0fdf3-learnfy]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore Learnfy.sln --locked-mode
      - run: |
          mkdir -p TestResults
          set -o pipefail
          dotnet build Learnfy.sln --configuration Release --no-restore 2>&1 | tee TestResults/build.log
      - name: Start isolated SQL Server for migration integration tests
        run: |
          password="CI-only-$(openssl rand -hex 24)!"
          echo "::add-mask::$password"
          echo "LEARNFY_TEST_SQLSERVER=Server=localhost,1433;User Id=sa;Password=$password;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
          docker run -d --name learnfy-sql-ci -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$password" -p 1433:1433 mcr.microsoft.com/mssql/server:2025-latest
          for attempt in $(seq 1 40); do
            if docker exec learnfy-sql-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'SQL Server did not become ready.' >&2
          exit 1
      - run: dotnet test Learnfy.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Smoke-test guarded development setup
        run: bash scripts/setup-development.sh --seed
      - name: Publish backend test diagnostics
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_report.py backend '${{ job.status }}'
      - name: Stop integration database
        if: always()
        run: docker rm -f learnfy-sql-ci || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: backend-validation
          path: |
            TestResults/
            web/APIs/**/packages.lock.json
          retention-days: 7
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore Learnfy.sln --locked-mode
      - run: dotnet build Learnfy.sln --configuration Release --no-restore
      - run: bash scripts/setup-development.sh --seed
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:browser --prefix web
      - name: Publish real browser test diagnostics
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_report.py browser '${{ job.status }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-validation
          path: |
            web/test-results/
            web/playwright-report/
            .cache/browser-stack/
          retention-days: 7
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze-results.log
      - name: Run mobile tests
        run: |
          set -o pipefail
          flutter test --machine | tee test-results.jsonl
      - name: Publish mobile test diagnostics
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_report.py" mobile '${{ job.status }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: mobile-lockfile
          path: mobile/pubspec.lock
          retention-days: 7
