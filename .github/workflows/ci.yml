name: Learnfy validation
on:
  push:
    branches: [main, arena/01a0fdf3-learnfy]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore Learnfy.sln -p:RestorePackagesWithLockFile=true
      - run: dotnet build Learnfy.sln --configuration Release --no-restore
      - name: Generate initial provider-specific migrations (one-time recovery step)
        env:
          ConnectionStrings__DefaultConnection: 'Server=localhost;Database=learnfy_design;Integrated Security=true;TrustServerCertificate=true'
        run: |
          dotnet tool restore
          Database__Provider=SqlServer dotnet ef migrations add InitialLearnfy --project web/APIs/Learnfy.Migrations.SqlServer --startup-project 'web/APIs/Authentication API' --output-dir Migrations
          Database__Provider=Sqlite ConnectionStrings__DefaultConnection='Data Source=design-only.db' dotnet ef migrations add InitialLearnfy --project web/APIs/Learnfy.Migrations.Sqlite --startup-project 'web/APIs/Authentication API' --output-dir Migrations
          dotnet build Learnfy.sln --configuration Release --no-restore
      - run: dotnet test Learnfy.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Publish backend test diagnostics
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_report.py backend '${{ job.status }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: backend-validation
          path: |
            TestResults/
            web/APIs/**/packages.lock.json
          retention-days: 7
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Run mobile tests
        run: |
          set -o pipefail
          flutter test --machine | tee test-results.jsonl
      - name: Publish mobile test diagnostics
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_report.py" mobile '${{ job.status }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: mobile-lockfile
          path: mobile/pubspec.lock
          retention-days: 7
