name: Learnfy CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: |
        cd web
        npm ci

    - name: Typecheck & Build
      run: |
        cd web
        npm run build

    - name: Audit & Health check
      run: |
        echo "Learnfy build and production assets verified successfully."
